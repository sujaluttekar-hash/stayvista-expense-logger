name: StayVista Expense Sheet Runner

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stayvista-expense-sheet-runner
  cancel-in-progress: false

jobs:
  run-expense-automation:
    name: Run expense automation
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Google Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y wget
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y ./google-chrome-stable_current_amd64.deb
          google-chrome --version
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Configure Google service-account credentials
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: \${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Missing GOOGLE_SERVICE_ACCOUNT_JSON repository secret."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > credentials.json
          chmod 600 credentials.json
          python -c "import json; json.load(open('credentials.json')); print('Service-account JSON validated.')"
      - name: Run Selenium expense automation
        env:
          GOOGLE_APPLICATION_CREDENTIALS: \${{ github.workspace }}/credentials.json
          PYTHONUNBUFFERED: "1"
        run: python -u expense_sheet_runner.py
      - name: Remove temporary credentials
        if: always()
        run: rm -f credentials.json
